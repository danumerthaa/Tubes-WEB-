<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Destinasi | XYZ WisataNusa AI</title>
  <!-- 1) Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- 2) Tailwind (CDN) dengan prefix tw-, sama seperti halaman lain -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      prefix: "tw-",
      corePlugins: { preflight: false },
      theme: { extend: { colors: { brand: "#2f3199", saffron: "#f5b301", soft: "#ececfa", ink: "#1b1b3a" } } }
    };
  </script>
  <!-- 3) CSS buatan sendiri -->
  <link rel="stylesheet" href="../wisatanusa-css/style.css">
</head>
<body class="d-flex flex-column min-vh-100" data-halaman="detail">
  <header class="sticky-top bg-white border-bottom">
    <nav class="navbar navbar-expand-lg" aria-label="Menu utama">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">XYZ WisataNusa AI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Buka menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto gap-lg-1">
            <li class="nav-item"><a class="nav-link px-3" href="index.html">Beranda</a></li>
            <li class="nav-item"><a class="nav-link px-3 active" href="destinasi.html">Destinasi</a></li>
            <li class="nav-item"><a class="nav-link px-3" href="rekomendasi.html">Rekomendasi AI</a></li>
            <li class="nav-item"><a class="nav-link px-3" href="tentang.html">Tentang</a></li>
            <li class="nav-item"><a class="nav-link px-3" href="kontak.html">Kontak</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container flex-grow-1 py-4 py-lg-5">
    <!-- Status loading dan error, diatur oleh detailDestinasi.js -->
    <p id="status" role="status">Memuat detail destinasi...</p>
    <p id="error" class="alert alert-danger" role="alert" hidden></p>

    <!-- Konten destinasi: awalnya tersembunyi, diisi dan ditampilkan oleh JavaScript -->
    <article id="detail" class="row g-4 g-lg-5" hidden>
      <div class="col-lg-6">
        <img id="gambar" class="img-fluid rounded-3 shadow-sm tw-w-full tw-aspect-[4/3] tw-object-cover tw-bg-soft" alt="">
      </div>
      <div class="col-lg-6">
        <h1 id="nama" class="text-primary mb-1"></h1>
        <p id="kategori" class="text-secondary"></p>
        <p id="deskripsi"></p>

        <dl class="tw-grid tw-grid-cols-[auto_1fr] tw-gap-x-4 tw-gap-y-2 border-top pt-3 mb-4">
          <dt class="text-secondary">Lokasi</dt><dd id="lokasi" class="mb-0"></dd>
          <dt class="text-secondary">Jam buka</dt><dd id="jam-buka" class="mb-0"></dd>
          <dt class="text-secondary">Tiket</dt><dd id="tiket" class="mb-0"></dd>
          <dt class="text-secondary">Fasilitas</dt><dd class="mb-0"><ul id="fasilitas" class="list-unstyled mb-0"></ul></dd>
        </dl>

        <a href="destinasi.html" class="btn btn-primary rounded-pill px-4">Kembali ke daftar destinasi</a>
      </div>
    </article>
  </main>

  <footer class="tw-bg-ink tw-text-indigo-100 py-3 mt-auto">
    <div class="container small">&copy; 2026 Kelompok 7 - XYZ WisataNusa AI. Sponsor: Diskominfo Kabupaten XYZ.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../wisatanusa-js/detailDestinasi.js"></script>
</body>
</html>
