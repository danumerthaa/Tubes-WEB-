<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Destinasi | XYZ WisataNusa AI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../wisatanusa-css/style.css">
</head>
<body>
  <header>
    <p><strong>XYZ WisataNusa AI</strong></p>
    <nav aria-label="Menu utama">
      <ul>
        <li><a href="index.html">Beranda</a></li>
        <li><a href="destinasi.html">Destinasi</a></li>
        <li><a href="rekomendasi.html">Rekomendasi AI</a></li>
        <li><a href="tentang.html">Tentang</a></li>
        <li><a href="kontak.html">Kontak</a></li>
      </ul>
    </nav>
  </header>

  <main class="container my-4">
    <!-- Status loading dan error, diatur oleh JavaScript -->
    <p id="status" role="status">Memuat detail destinasi...</p>
    <p id="error" class="alert alert-danger" role="alert" hidden></p>

    <!-- Konten destinasi: awalnya tersembunyi, diisi dan ditampilkan oleh JavaScript -->
    <article id="detail" class="row g-4" hidden>
      <div class="col-lg-6">
        <img id="gambar" class="img-fluid rounded" alt="">
      </div>
      <div class="col-lg-6">
        <h1 id="nama"></h1>
        <p id="kategori" class="text-secondary"></p>
        <p id="deskripsi"></p>

        <dl>
          <dt>Lokasi</dt>
          <dd id="lokasi"></dd>
          <dt>Jam buka</dt>
          <dd id="jam-buka"></dd>
          <dt>Tiket</dt>
          <dd id="tiket"></dd>
          <dt>Fasilitas</dt>
          <dd><ul id="fasilitas"></ul></dd>
        </dl>

        <a href="destinasi.html" class="btn btn-outline-primary">Kembali ke daftar destinasi</a>
      </div>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 Kelompok 7 - XYZ WisataNusa AI. Sponsor: Diskominfo Kabupaten XYZ.</p>
  </footer>

  <script src="../wisatanusa-js/detailDestinasi.js"></script>
</body>
</html>
