<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destinasi | XYZ WisataNusa AI</title>
  <!-- 1) Bootstrap: komponen siap pakai (navbar, grid, card, form) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- 2) Tailwind (CDN): class utility, SEMUA diawali "tw-" agar tidak bentrok dengan Bootstrap.
        preflight dimatikan supaya reset CSS Tailwind tidak merusak Bootstrap. -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      prefix: "tw-",
      corePlugins: { preflight: false },
      theme: { extend: { colors: { brand: "#2f3199", saffron: "#f5b301", soft: "#ececfa", ink: "#1b1b3a" } } }
    };
  </script>
  <!-- 3) CSS buatan sendiri (font, tema, motif tenun) -->
  <link rel="stylesheet" href="../wisatanusa-css/style.css">
</head>
<body class="d-flex flex-column min-vh-100" data-halaman="destinasi">
  <!-- HEADER + NAVBAR Bootstrap: sama di semua halaman (nanti jadi komponen Navbar di React) -->
  <header class="sticky-top bg-white border-bottom">
    <nav class="navbar navbar-expand-lg" aria-label="Menu utama">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">XYZ WisataNusa AI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Buka menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto gap-lg-1">
          <li class="nav-item"><a class="nav-link px-3" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link px-3 active" href="destinasi.html" aria-current="page">Destinasi</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="rekomendasi.html">Rekomendasi AI</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="tentang.html">Tentang</a></li>
          <li class="nav-item"><a class="nav-link px-3" href="kontak.html">Kontak</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container flex-grow-1 py-4 py-lg-5">
    <h1 class="text-primary mb-4">Daftar destinasi</h1>

    <!-- Form pencarian: Bootstrap row/col + form-control -->
    <form id="form-cari" action="destinasi.html" method="get" role="search" class="row g-3 align-items-end bg-white border rounded p-3 mb-4">
      <div class="col-12 col-md-5">
        <label for="cari" class="form-label fw-semibold">Cari destinasi</label>
        <input type="search" class="form-control" id="cari" name="q" placeholder="Contoh: pantai">
      </div>
      <div class="col-12 col-md-4">
        <label for="kategori" class="form-label fw-semibold">Kategori</label>
        <select class="form-select" id="kategori" name="kategori"><option value="">Semua</option><option value="pantai">Pantai</option><option value="alam">Alam</option><option value="budaya">Budaya</option><option value="kuliner">Kuliner</option></select>
      </div>
      <div class="col-12 col-md-3 d-grid">
        <button type="submit" class="btn btn-primary rounded-pill">Cari destinasi</button>
      </div>
    </form>

    <p id="jumlah" class="fw-semibold" aria-live="polite">Memuat destinasi...</p>
    <!-- Status loading/error, pesan kosong, dan kartu diisi oleh js/main.js -->
    <div id="status-destinasi" aria-live="polite"></div>
    <p id="kosong-destinasi" class="alert alert-warning d-none" role="status">Tidak ada destinasi yang cocok dengan pencarianmu.</p>
    <ul id="daftar-destinasi" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 list-unstyled mb-0"></ul>
  </main>

  <footer class="tw-bg-ink tw-text-indigo-100 py-3 mt-auto">
    <div class="container small">&copy; 2026 Kelompok 7 - XYZ WisataNusa AI. Sponsor: Diskominfo Kabupaten XYZ.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jQuery lalu JavaScript buatan sendiri -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
